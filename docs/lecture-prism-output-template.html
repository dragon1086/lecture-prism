<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root { --bg:#0e101c; --panel:#161a2a; --panel-2:#1d2335; --fg:#f5f7fb; --muted:#9ba3b6; --line:#30374b; --green:#73d99a; --indigo:#9da7ff; --yellow:#f0c16c; --red:#f18484; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 "Apple SD Gothic Neo",Pretendard,"Noto Sans KR",system-ui,sans-serif; }
    a { color:var(--indigo); }
    .shell { max-width:1180px; margin:0 auto; padding:40px 28px 72px; }
    header { border-top:4px solid var(--green); padding:26px 0 22px; }
    .eyebrow { color:var(--green); font-weight:800; letter-spacing:.04em; }
    h1 { margin:8px 0 4px; font-size:clamp(30px,4vw,48px); line-height:1.18; }
    .lead { margin:0; color:var(--muted); font-size:19px; }
    .meta { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:14px; color:var(--muted); font-size:14px; }
    .layout { display:grid; grid-template-columns:210px minmax(0,1fr); gap:28px; align-items:start; }
    aside { position:sticky; top:18px; }
    aside nav { display:grid; gap:7px; }
    aside a { padding:7px 10px; border-left:2px solid var(--line); text-decoration:none; font-size:14px; }
    aside a:hover, aside a:focus { border-color:var(--green); color:var(--fg); }
    .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
    .summary article { padding:15px 16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
    .summary b { display:block; margin-bottom:4px; color:var(--green); font-size:13px; }
    .summary p { margin:0; }
    details { margin:12px 0; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    summary { cursor:pointer; padding:14px 17px; background:var(--panel-2); font-size:20px; font-weight:800; }
    summary:focus-visible, button:focus-visible, input:focus-visible { outline:2px solid var(--yellow); outline-offset:2px; }
    .section-body { padding:17px; }
    .section-body > :first-child { margin-top:0; }
    .section-body > :last-child { margin-bottom:0; }
    table { width:100%; border-collapse:collapse; margin:12px 0; }
    th, td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { color:var(--green); font-weight:800; }
    code, pre { font-family:"SFMono-Regular",Consolas,monospace; }
    code { color:var(--yellow); }
    pre { overflow:auto; padding:14px; background:#0a0c14; border:1px solid var(--line); border-radius:8px; }
    .toolbar { display:flex; gap:8px; margin:0 0 14px; }
    input, button { color:var(--fg); background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:8px 10px; font:inherit; }
    button { cursor:pointer; }
    .next { margin-top:22px; padding:16px 18px; border-left:3px solid var(--indigo); background:var(--panel); }
    .muted { color:var(--muted); }
    @media (max-width:760px) { .shell { padding:24px 16px 52px; } .layout { display:block; } aside { position:static; margin-bottom:18px; } .summary { grid-template-columns:1fr; } table { display:block; overflow:auto; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="eyebrow">lecture-prism · interactive report</div>
      <h1>{{TITLE}}</h1>
      <p class="lead">{{ONE_LINE_SUMMARY}}</p>
      <div class="meta"><span>생성 시각: {{CREATED_AT}}</span><span>프로필: {{PROFILE}}</span><span>데이터 원천: {{DATA_SOURCE}}</span></div>
    </header>
    <div class="layout">
      <aside aria-label="보고서 목차"><nav>{{TOC}}</nav></aside>
      <main>
        <div class="toolbar"><input data-search type="search" placeholder="이 보고서에서 찾기" aria-label="보고서 검색"><button data-toggle type="button">모두 열기</button></div>
        <section class="summary" aria-label="핵심 요약">
          <article><b>상태</b><p>{{STATUS}}</p></article>
          <article><b>핵심 결과</b><p>{{KEY_RESULT}}</p></article>
          <article><b>확인 필요</b><p>{{NEEDS_REVIEW}}</p></article>
        </section>
        <!-- 각 주제는 <details open><summary>제목</summary><div class="section-body">핵심 1문장 · 근거 3개 이내 · 다음 행동 1줄</div></details>로 넣습니다. -->
        {{SECTIONS}}
        <div class="next"><strong>다음 한 가지</strong><br>{{NEXT_ACTION}}</div>
      </main>
    </div>
  </div>
  <script>
    (() => {
      const search = document.querySelector('[data-search]');
      const sections = [...document.querySelectorAll('details')];
      const toggle = document.querySelector('[data-toggle]');
      search?.addEventListener('input', () => {
        const q = search.value.trim().toLowerCase();
        sections.forEach((section) => {
          const hit = !q || section.textContent.toLowerCase().includes(q);
          section.hidden = !hit;
          if (q && hit) section.open = true;
        });
      });
      toggle?.addEventListener('click', () => {
        const open = toggle.textContent.includes('열기');
        sections.forEach((section) => { section.open = open; });
        toggle.textContent = open ? '모두 닫기' : '모두 열기';
      });
    })();
  </script>
</body>
</html>
