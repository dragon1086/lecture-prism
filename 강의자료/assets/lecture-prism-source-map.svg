<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="lecture-prism-source-map-title lecture-prism-source-map-desc">
    <title id="lecture-prism-source-map-title">lecture-prism 첫 실행 흐름</title>
    <desc id="lecture-prism-source-map-desc">main.py가 후보 선별, 분석, 가상 매매 판단, 결과 기록을 차례로 실행합니다. 아래에는 실행 환경, 데이터와 보고서, 저장과 화면, 선택 기능과 참고 자료를 묶어 보여 줍니다.</desc>
    <defs>
      <marker id="source-map-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0 0L12 6L0 12Z" fill="#aeb8cb"/>
      </marker>
      <marker id="source-map-arrow-accent" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0 0L12 6L0 12Z" fill="#73d99a"/>
      </marker>
      <style>
        .eyebrow { font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; font-size: 24px; font-weight: 700; fill: #73d99a; letter-spacing: 1px; }
        .rule { stroke: #2d3953; stroke-width: 2; }
        .flow { fill: none; stroke: #aeb8cb; stroke-width: 4; marker-end: url(#source-map-arrow); }
        .flow-accent { fill: none; stroke: #73d99a; stroke-width: 4; marker-end: url(#source-map-arrow-accent); }
        .node { fill: #101827; stroke: #3c4a67; stroke-width: 2; }
        .focal { fill: #102a27; stroke: #73d99a; stroke-width: 3; }
        .support { fill: #0d1523; stroke: #34415c; stroke-width: 2; }
        .num { font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 16px; font-weight: 700; fill: #8f9bb3; text-anchor: middle; }
        .num-focal { font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 16px; font-weight: 700; fill: #73d99a; text-anchor: middle; }
        .file { font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 22px; font-weight: 700; fill: #f4f7ff; text-anchor: middle; }
        .file-small { font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 18px; font-weight: 700; fill: #f4f7ff; text-anchor: middle; }
        .file-support { font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 16px; font-weight: 700; fill: #d9e0ee; text-anchor: middle; }
        .role { font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; font-size: 20px; fill: #c5ccdc; text-anchor: middle; }
        .support-title { font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; font-size: 20px; font-weight: 700; fill: #f4f7ff; text-anchor: middle; }
        .support-note { font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; font-size: 16px; fill: #aeb8cb; text-anchor: middle; }
        .note { font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; font-size: 22px; fill: #aeb8cb; }
      </style>
    </defs>

    <rect width="1600" height="900" fill="#050d1b"/>
    <text class="eyebrow" x="64" y="104">처음 실행에서 보는 핵심 흐름</text>
    <line class="rule" x1="64" y1="144" x2="1536" y2="144"/>

    <!-- Arrows are drawn before nodes so every path stays readable. -->
    <path class="flow" d="M296 356H356"/>
    <path class="flow" d="M600 356H660"/>
    <path class="flow" d="M904 356H964"/>
    <path class="flow" d="M1208 356H1268"/>
    <path class="flow-accent" d="M1396 424V580"/>

    <rect class="node" x="64" y="288" width="232" height="136" rx="8"/>
    <text class="num" x="180" y="324">01</text>
    <text class="file" x="180" y="364">main.py</text>
    <text class="role" x="180" y="400">시작과 순서</text>

    <rect class="node" x="368" y="288" width="232" height="136" rx="8"/>
    <text class="num" x="484" y="324">02</text>
    <text class="file" x="484" y="364">screening.py</text>
    <text class="role" x="484" y="400">후보 고르기</text>

    <rect class="node" x="672" y="288" width="232" height="136" rx="8"/>
    <text class="num" x="788" y="324">03</text>
    <text class="file" x="788" y="364">analysis.py</text>
    <text class="role" x="788" y="400">분석 보고서</text>

    <rect class="node" x="976" y="288" width="232" height="136" rx="8"/>
    <text class="num" x="1092" y="324">04</text>
    <text class="file" x="1092" y="364">trading.py</text>
    <text class="role" x="1092" y="400">가상 매매 판단</text>

    <rect class="node" x="1280" y="288" width="232" height="136" rx="8"/>
    <text class="num" x="1396" y="324">05</text>
    <text class="file" x="1396" y="364">feedback.py</text>
    <text class="role" x="1396" y="400">결과 기록</text>

    <text class="eyebrow" x="64" y="528">흐름을 돕는 보조 요소</text>

    <rect class="support" x="64" y="568" width="288" height="160" rx="8"/>
    <text class="support-title" x="208" y="612">실행 환경</text>
    <text class="file-support" x="208" y="652">runtime_config.py</text>
    <text class="file-support" x="208" y="680">llm_provider.py</text>
    <text class="support-note" x="208" y="712">실행 모드와 AI 연결</text>

    <rect class="support" x="400" y="568" width="288" height="160" rx="8"/>
    <text class="support-title" x="544" y="612">데이터·보고서</text>
    <text class="file-support" x="544" y="652">data_source.py</text>
    <text class="file-support" x="544" y="680">report_writer.py</text>
    <text class="support-note" x="544" y="712">데이터를 읽고 설명을 정리</text>

    <rect class="support" x="736" y="568" width="360" height="160" rx="8"/>
    <text class="support-title" x="916" y="612">선택 기능·참고</text>
    <text class="file-support" x="916" y="652">notifications.py · Discord</text>
    <text class="file-support" x="916" y="680">brokers/ · cores/</text>
    <text class="support-note" x="916" y="712">알림, 증권사 연동, 원본 비교</text>

    <rect class="focal" x="1280" y="568" width="232" height="160" rx="8"/>
    <text class="num-focal" x="1396" y="604">저장·화면</text>
    <text class="file-small" x="1396" y="636">prism.db</text>
    <text class="file-small" x="1396" y="660">dashboard.py</text>
    <text class="role" x="1396" y="696">결과를 저장하고</text>
    <text class="role" x="1396" y="720">보여 줌</text>

    <line class="rule" x1="64" y1="784" x2="1536" y2="784"/>
    <text class="note" x="64" y="832">처음에는 연습 데이터와 가상 매매로 이 흐름을 끝까지 확인합니다.</text>
  </svg>
